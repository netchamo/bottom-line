<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#262A4D"/>
      <stop offset="1" stop-color="#0E1022"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7ECD0"/>
      <stop offset="1" stop-color="#EBD9AF"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A2E27"/>
      <stop offset="1" stop-color="#521913"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E6B4"/>
      <stop offset=".38" stop-color="#D1A956"/>
      <stop offset=".58" stop-color="#F0D892"/>
      <stop offset=".82" stop-color="#B88E45"/>
      <stop offset="1" stop-color="#8E6A2E"/>
    </linearGradient>
    <clipPath id="sheet"><rect x="136" y="132" width="240" height="276" rx="20"/></clipPath>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.14) translate(-256 -256)">

  <!-- the sheet -->
  <g filter="url(#drop)">
    <rect x="136" y="132" width="240" height="276" rx="20" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#sheet)">
    <!-- ruled lines -->
    <g stroke="#46628A" stroke-opacity=".22" stroke-width="2">
      <line x1="136" y1="226" x2="376" y2="226"/>
      <line x1="136" y1="262" x2="376" y2="262"/>
      <line x1="136" y1="298" x2="376" y2="298"/>
    </g>
    <!-- margin line -->
    <g stroke="#963428" stroke-opacity=".45" stroke-width="2">
      <line x1="350" y1="168" x2="350" y2="408"/>
      <line x1="356" y1="168" x2="356" y2="408"/>
    </g>
    <!-- leather binding with gold stitching -->
    <rect x="136" y="132" width="240" height="38" fill="url(#leather)"/>
    <line x1="146" y1="160" x2="366" y2="160" stroke="#D6B26E" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  </g>

  <!-- text lines; the middle one is picked with a soft highlighter -->
  <rect x="172" y="206" width="160" height="12" rx="6" fill="#2E2418" opacity=".45"/>
  <rect x="160" y="236" width="182" height="26" rx="6" fill="#CFA868" opacity=".55"/>
  <rect x="196" y="243" width="136" height="12" rx="6" fill="#2E2418" opacity=".8"/>
  <rect x="184" y="278" width="148" height="12" rx="6" fill="#2E2418" opacity=".45"/>

  <!-- the bottom line: a brass double rule -->
  <rect x="168" y="334" width="176" height="11" rx="2" fill="#A8823F"/>
  <rect x="168" y="355" width="176" height="5" rx="2" fill="#A8823F"/>

  <!-- brass clip -->
  <g filter="url(#drop)">
    <rect x="190" y="104" width="132" height="50" rx="16" fill="url(#brass)"/>
  </g>
  <rect x="230" y="116" width="52" height="15" rx="7.5" fill="#2B1A0E"/>
  <circle cx="208" cy="141" r="5" fill="#8E6A2E"/><circle cx="208" cy="141" r="2.2" fill="#F7E7B8"/>
  <circle cx="304" cy="141" r="5" fill="#8E6A2E"/><circle cx="304" cy="141" r="2.2" fill="#F7E7B8"/>
  </g>
</svg>
